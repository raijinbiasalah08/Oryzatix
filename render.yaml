services:
  - type: web
    name: oryzatix-backend
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    envVars:
      - key: APP_NAME
        value: "ORYZATIX"
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: "false"
      - key: APP_URL
        value: https://oryzatix-backend.onrender.com
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-3.8-flash
      - key: APP_KEY
        generateValue: true
      - key: LOG_CHANNEL
        value: stderr
      - key: SESSION_DRIVER
        value: cookie
      - key: CACHE_STORE
        value: array
      - key: RUN_MIGRATIONS
        value: "false"
      - key: DB_CONNECTION
        value: mysql
      - key: DB_HOST
        value: gateway01.ap-northeast-1.prod.aws.tidbcloud.com
      - key: DB_PORT
        value: "4000"
      - key: DB_DATABASE
        value: oryzatix
      - key: DB_USERNAME
        value: ME2ewvWMas2ufbA.root
      - key: DB_PASSWORD
        value: eKumpGS5xVlylxnu
      - key: MYSQL_ATTR_SSL_CA
        value: /var/www/html/database/certs/ca.pem
      - key: SANCTUM_STATEFUL_DOMAINS
        value: "*.vercel.app,localhost"
